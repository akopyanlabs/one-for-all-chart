# CI test values: StatefulSet with persistence, configmap and extra volumes.
global:
  deploymentType: StatefulSet

image:
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

command:
  - docker-entrypoint.sh
args:
  - postgres
  - -c
  - max_connections=200

serviceAccount: postgres-sa
automountServiceAccountToken: false

service:
  type: ClusterIP
  headless: true         # governing-сервис StatefulSet — даёт pod'ам стабильные DNS-имена
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

env:
  - name: POSTGRES_DB
    value: app

secrets:
  POSTGRES_PASSWORD: supersecret

resources:
  cpu: 500m
  memory: 512Mi

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 10"]

strategy:
  type: RollingUpdate

configmap:
  - name: pg-config
    podMountPath: /etc/postgresql
    readOnly: true
    data:
      postgresql.conf: |
        max_connections: 100
        shared_buffers: 128MB

persistence:
  claims:
    - name: data
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      storageClass: standard
      podMountPath: /var/lib/postgresql/data

extraVolumes:
  - name: tmp
    emptyDir: {}

extraVolumeMounts:
  - name: tmp
    mountPath: /tmp
