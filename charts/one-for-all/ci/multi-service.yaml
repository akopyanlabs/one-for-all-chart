# CI test values: single workload with multiple Services (services[]).
image:
  repository: myapp
  tag: "1.0.0"
  pullPolicy: IfNotPresent

services:
  - name: http
    type: ClusterIP
    ports:
      - name: http
        protocol: TCP
        port: 80
        targetPort: 8080
  - name: grpc
    type: ClusterIP
    ports:
      - name: grpc
        protocol: TCP
        port: 9090
        targetPort: 9090
  - name: admin
    type: NodePort
    ports:
      - name: admin
        protocol: TCP
        port: 8081
        targetPort: 8081
        nodePort: 30081
