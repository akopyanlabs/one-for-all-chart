name: Release Chart

# Path A: стандартная модель chart-releaser.
# Релиз управляется пушем в main — cr сам определяет, какая версия в Chart.yaml
# изменилась с прошлого релиза, пакует чарт, создаёт тэг <chart>-<version>
# и GitHub Release. Никаких внешних v*-тэгов не требуется.
on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/release.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: helm lint (default values)
        run: helm lint charts/one-for-all

      - name: helm lint (ci/ values per mode)
        run: |
          if compglob=$(compgen -G "charts/one-for-all/ci/*.yaml") && [ -n "$compglob" ]; then
            for f in charts/one-for-all/ci/*.yaml; do
              helm lint charts/one-for-all -f "${f}"
            done
          fi

      - name: helm template renders without error
        run: |
          helm template test charts/one-for-all >/dev/null
          if compglob=$(compgen -G "charts/one-for-all/ci/*.yaml") && [ -n "$compglob" ]; then
            for f in charts/one-for-all/ci/*.yaml; do
              helm template test charts/one-for-all -f "${f}" >/dev/null
            done
          fi

  release:
    needs: lint
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
